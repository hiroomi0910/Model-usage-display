name: Release

on:
  push:
    tags:
      - "v*"
  # Marketplace の発行者メンバーに登録するマネージドIDのIDを調べるときに手動で実行する
  workflow_dispatch:

permissions:
  contents: write
  # Microsoft Entra ID へのフェデレーションサインイン（OIDC）に必要
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Azure のフェデレーション資格情報は、この environment 名を subject にして信頼する
    environment: marketplace
    # シークレット未登録の間、公開ステップを自動スキップするために job レベルで env に流す
    # （step レベルの env はその step 自身の if からは参照できないため）
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "vsix=model-usage-display-$pkg.vsix" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: npm run compile

      - name: Check localization coverage
        run: node scripts/check-l10n.js

      # CHANGELOG に該当バージョンの節が無ければここで止まる
      - name: Extract release notes from CHANGELOG
        run: node scripts/release-notes.js "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      # 公開シークレットの有無に関わらず Release に添付できるよう、パッケージングは自前で行う
      - name: Package VSIX
        run: npx vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.vsix }}
          body_path: ${{ runner.temp }}/release-notes.md

      # 片方だけ公開に失敗したリリースを再実行できるよう、公開済みのバージョンは飛ばす
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          extensionFile: ${{ steps.version.outputs.vsix }}
          skipDuplicate: true

      # Azure DevOps の全組織対象 PAT は 2026-03-15 以降新規作成できず、2026-12-01 に廃止されるため、
      # Marketplace へは Microsoft Entra ID（マネージドID + フェデレーション資格情報）で公開する
      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        if: env.AZURE_CLIENT_ID != ''
        run: npx vsce publish --packagePath "${{ steps.version.outputs.vsix }}" --azure-credential --skip-duplicate

  # 手動実行専用: マネージドIDの Marketplace 上のIDを表示する（発行者の Members に Contributor として追加する値）
  marketplace-identity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the identity ID for the Marketplace publisher
        run: |
          id="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "Marketplace identity ID: $id"
          echo "Marketplace の発行者 hiroomi の Members に、次のIDを Contributor として追加してください: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
