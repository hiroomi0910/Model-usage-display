name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Check localization coverage
        run: node scripts/check-l10n.js

      - name: Package VSIX (smoke test)
        run: npx vsce package --out /tmp/smoke.vsix
